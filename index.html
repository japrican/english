// ============================================================
// PWA SETUP (manifest + service worker + install prompt)
// ============================================================
(function() {
  // 1. manifest.json を動的に生成してリンク
  const manifest = {
    name: PWA_APP_NAME,
    short_name: PWA_APP_SHORT_NAME,
    description: PWA_APP_DESC,
    start_url: "./",
    display: "standalone",
    background_color: PWA_BG_COLOR,
    theme_color: PWA_THEME_COLOR,
    orientation: "portrait",
    icons: [
      { src: "data:image/png;base64," + PWA_ICON_192, sizes: "192x192", type: "image/png", purpose: "any maskable" },
      { src: "data:image/png;base64," + PWA_ICON_512, sizes: "512x512", type: "image/png", purpose: "any maskable" }
    ]
  };
  const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
  const manifestURL = URL.createObjectURL(manifestBlob);
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = manifestURL;
  document.head.appendChild(link);

  // 2. iOS用のホーム画面アイコン・メタタグ
  const appleIcon = document.createElement('link');
  appleIcon.rel = 'apple-touch-icon';
  appleIcon.href = "data:image/png;base64," + PWA_ICON_192;
  document.head.appendChild(appleIcon);

  const metaCapable = document.createElement('meta');
  metaCapable.name = 'apple-mobile-web-app-capable';
  metaCapable.content = 'yes';
  document.head.appendChild(metaCapable);

  const metaStatusBar = document.createElement('meta');
  metaStatusBar.name = 'apple-mobile-web-app-status-bar-style';
  metaStatusBar.content = 'black-translucent';
  document.head.appendChild(metaStatusBar);

  const metaTitle = document.createElement('meta');
  metaTitle.name = 'apple-mobile-web-app-title';
  metaTitle.content = PWA_APP_SHORT_NAME;
  document.head.appendChild(metaTitle);

  const metaTheme = document.createElement('meta');
  metaTheme.name = 'theme-color';
  metaTheme.content = PWA_THEME_COLOR;
  document.head.appendChild(metaTheme);

  // 3. ホーム画面に追加していない場合に案内を表示（iOS Safari向け）
  function isInStandaloneMode() {
    return ('standalone' in window.navigator) && (window.navigator.standalone);
  }
  function isIOS() {
    return /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
  }

  function showInstallHint() {
    if (isInStandaloneMode()) return; // すでにホーム画面から起動している
    if (localStorage.getItem('pwa_install_hint_dismissed')) return;
    if (!isIOS()) return; // 今回はiOS Safari向けの案内のみ実装

    const hint = document.createElement('div');
    hint.id = 'pwa-install-hint';
    hint.style = `
      position: fixed; left: 16px; right: 16px; bottom: 56px;
      background: white; border: 2px solid ${PWA_THEME_COLOR};
      border-radius: 16px; padding: 14px 16px; z-index: 10000;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
      font-family: 'Zen Maru Gothic', sans-serif;
      display: flex; align-items: center; gap: 10px;
    `;
    hint.innerHTML = `
      <div style="flex:1; font-size:12px; line-height:1.6; color:#1c1c1a;">
        <strong>📲 ホーム画面に追加</strong>すると、アプリのように使えます。<br>
        下の<strong>共有ボタン</strong>（□と↑）→「ホーム画面に追加」をタップ。
      </div>
      <button id="pwa-hint-close" style="background:none;border:none;font-size:18px;cursor:pointer;color:#9ca3af;flex-shrink:0;">✕</button>
    `;
    document.body.appendChild(hint);
    document.getElementById('pwa-hint-close').onclick = function() {
      hint.remove();
      localStorage.setItem('pwa_install_hint_dismissed', 'true');
    };
  }

  document.addEventListener('DOMContentLoaded', function() {
    setTimeout(showInstallHint, 2000);
  });
})();

</script>
<style>:root {
  --white: #ffffff;
  --off-white: #f8f8f6;
  --ink: #3f3f46;
  --gray: #6b6b68;
  --light-gray: #e8e8e4;

  --grade1-accent: #f9a8d4;
  --grade1-bg: #fdf2f8;
  --grade2-accent: #f472b6;
  --grade2-bg: #fdf2f8;
  --grade3-accent: #ec4899;
  --grade3-bg: #fdf2f8;

  --coral: #ff5e5b;
  --mint: #00c9a7;
  --yellow: #ffe135;
  --sky: #5bc8f5;
  --lavender: #a78bfa;

  --cur-accent: var(--grade1-accent);
  --cur-bg: var(--grade1-bg);

  --radius: 14px;
  --radius-sm: 8px;
  --shadow: 3px 3px 0 var(--ink);
  --shadow-sm: 2px 2px 0 var(--ink);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--off-white);
  color: var(--ink);
  min-height: 100vh;
}
.screen { display: none; min-height: 100vh; flex-direction: column; }
.screen.active { display: flex; }

.app-header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px;
  background: #1c1c1a;
  position: sticky; top: 0; z-index: 100;
  border-bottom: 3px solid var(--cur-accent);
}
.back-btn {
  background: none; border: 2px solid rgba(255,255,255,0.6); color: #ffffff;
  font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700;
  letter-spacing: 0.1em; padding: 5px 12px; cursor: pointer;
  border-radius: 100px; transition: all 0.15s; flex-shrink: 0;
}

const TRIAL_DAYS = 7;
const UNLOCK_STORAGE_KEY = 'app_unlocked_' + (typeof APP_ID !== 'undefined' ? APP_ID : 'default');
const BUNDLE_UNLOCK_KEY = 'bundle_unlocked_v1';
const TRIAL_START_KEY = 'app_trial_start_' + (typeof APP_ID !== 'undefined' ? APP_ID : 'default');

function initTrialSystem() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('unlock') === 'yes') {
    // この教科だけを解放
    localStorage.setItem(UNLOCK_STORAGE_KEY, 'true');
  }
  if (params.get('unlock') === 'bundle') {
    // 全教科セット購入 → 全アプリ共通のキーを解放
    // (同一オリジンなので、どのアプリで実行しても全アプリに反映される)
    localStorage.setItem(BUNDLE_UNLOCK_KEY, 'true');
  }
  if (!localStorage.getItem(TRIAL_START_KEY)) {
    localStorage.setItem(TRIAL_START_KEY, Date.now().toString());
  }
}

function isUnlocked() {
  return localStorage.getItem(UNLOCK_STORAGE_KEY) === 'true'
      || localStorage.getItem(BUNDLE_UNLOCK_KEY) === 'true';
}

function getTrialDaysLeft() {
  const start = parseInt(localStorage.getItem(TRIAL_START_KEY) || Date.now().toString());
  const elapsed = Date.now() - start;
  const daysElapsed = elapsed / (1000 * 60 * 60 * 24);
  return Math.max(0, Math.ceil(TRIAL_DAYS - daysElapsed));

  {

    scene:"📍 ミアが家族の写真を見せてくれる",
    char1:{icon:"👧",name:"Mia",en:"This is my family. My father is a doctor. He is very kind.",jp:"これは私の家族です。私の父は医者です。彼はとても優しいです。"},
    char2:{icon:"🧑‍🎓",name:"Yuto",en:"Wow! Is she your sister? Her hair is so long!",jp:"わあ！彼女はあなたの妹ですか？彼女の髪はとても長いですね！"},
    grammarLabel:"人称代名詞の変化",
    grammarPattern:"I → my → me / He → his → him / She → her → her",
    grammarText:"人称代名詞は「主語（〜は）」「所有格（〜の）」「目的格（〜を）」で形が変わる。<span class=\"ex\">I love my mother. She loves me too.</span>特に he/his/him、she/her/her の変化はテストでよく狙われるので要注意。",
    vocab:[["family", "家族"], ["father", "父"], ["sister", "姉・妹"], ["kind", "優しい"], ["long", "長い"]],
    quiz:[{q:"\"This is ___ book.\"（これは彼の本です）の空欄は？",opts:["he", "his", "him", "her"],ans:1,exp:"「〜の」を表す所有格は his（彼の）です。"},{q:"\"I like ___.\"（私は彼女が好きです）の空欄は？",opts:["she", "her", "hers", "he"],ans:1,exp:"「〜を」を表す目的格は her（彼女を）です。"},{q:"\"He\" の所有格（〜の）は？",opts:["him", "his", "he's", "he"],ans:1,exp:"he の所有格は his です。"}]
  },
  {
    id:3,title:"一般動詞（現在形）",subtitle:"be動詞じゃない「する」を表す動詞",keyword:"一般動詞",
    scene:"📍 趣味について話す",
    char1:{icon:"🧑‍🎓",name:"Yuto",en:"I like soccer. I play soccer every weekend.",jp:"僕はサッカーが好きです。毎週末サッカーをします。"},
    char2:{icon:"👧",name:"Mia",en:"That's cool! I like music. I play the piano every day.",jp:"いいね！私は音楽が好きです。毎日ピアノを弾きます。"},
    grammarLabel:"一般動詞の基本",
    grammarPattern:"I/You/We/They + 動詞の原形 + 〜.",
    grammarText:"like（好き）、play（する・演奏する）、have（持つ）のように動作や状態を表す動詞が「一般動詞」。be動詞と違って<strong>am/are/isは使わない</strong>のがポイント。<span class=\"ex\">I like dogs. (○) / I am like dogs. (×)</span>",
    vocab:[["like", "好きだ"], ["play", "する・演奏する"], ["every", "毎〜"], ["weekend", "週末"], ["music", "音楽"]],
    quiz:[{q:"正しい文はどっち？",opts:["I am like cats.", "I like cats.", "I is like cats.", "I likes cats."],ans:1,exp:"一般動詞 like の前に be動詞は不要です。主語がIなのでlikeのまま使います。"},{q:"\"play the piano\" の意味は？",opts:["ピアノを買う", "ピアノを弾く", "ピアノを見る", "ピアノを習う"],ans:1,exp:"play the 楽器名 で「〜を演奏する」という意味になります。"},{q:"\"every weekend\" の意味は？",opts:["先週末", "今週末", "毎週末", "週末以外"],ans:2,exp:"every + 時を表す語 で「毎〜」という意味になります。"}]
  },
  {
    id:4,title:"疑問文・否定文（一般動詞）",subtitle:"Do you...? と I don't... の作り方",keyword:"do/don't",
    scene:"📍 好きな食べ物を聞く",
    char1:{icon:"👧",name:"Mia",en:"Do you like sushi? I love Japanese food!",jp:"あなたは寿司が好きですか？私は日本食が大好きです！"},
    char2:{icon:"🧑‍🎓",name:"Yuto",en:"Yes, I do! But I don't like natto. It's too smelly for me.",jp:"うん、好きだよ！でも納豆は好きじゃないんだ。僕には匂いが強すぎて。"},
    grammarLabel:"疑問文と否定文の作り方",
    grammarPattern:"Do + 主語 + 動詞〜? / 主語 + don't + 動詞〜.",
    grammarText:"一般動詞の疑問文は<strong>文の最初にDo</strong>を置く。否定文は動詞の前に<strong>don't</strong>を置く。<span class=\"ex\">Do you play tennis? / I don't play tennis.</span>答えるときは Yes, I do. / No, I don't. の形を使う。",
    vocab:[["sushi", "寿司"], ["love", "大好き"], ["but", "しかし"], ["smelly", "匂いが強い"], ["too", "〜すぎる"]],
    quiz:[{q:"\"あなたは英語を話しますか？\"を英語にすると？",opts:["You speak English?", "Do you speak English?", "Are you speak English?", "Speak you English?"],ans:1,exp:"一般動詞の疑問文は Do you + 動詞? の形になります。"},{q:"\"私は魚が好きではありません。\"を英語にすると？",opts:["I am not like fish.", "I don't like fish.", "I no like fish.", "I isn't like fish."],ans:1,exp:"一般動詞の否定文は I don't + 動詞 の形になります。"},{q:"\"Do you like cats?\" に「はい好きです」と答えるには？",opts:["Yes, I am.", "Yes, I do.", "Yes, I like.", "Yes, do."],ans:1,exp:"Do で聞かれたら Yes, I do. / No, I don't. で答えます。"}]
  },
  {
    id:5,title:"3人称単数現在 (He/She + 動詞s)",subtitle:"動詞にsをつける、たった一つのルール",keyword:"3単現のs",
    scene:"📍 ミアの兄について話す",
    char1:{icon:"👧",name:"Mia",en:"My brother likes video games. He plays games every night.",jp:"私の兄はテレビゲームが好きです。彼は毎晩ゲームをします。"},
    char2:{icon:"🧑‍🎓",name:"Yuto",en:"Does he play with friends online?",jp:"彼は友達とオンラインで一緒に遊びますか？"},
    grammarLabel:"3人称単数現在のs",
    grammarPattern:"He/She/It + 動詞 + s（または es）",
    grammarText:"主語が<strong>He・She・It（3人称単数）</strong>で「現在」の文のとき、動詞の最後にsをつける。<span class=\"ex\">I like → He likes / I play → She plays</span>疑問文・否定文では Does / doesn't を使い、動詞のsは消える点に注意。<span class=\"ex\">Does he play? / He doesn't play.</span>",
    vocab:[["brother", "兄・弟"], ["video game", "テレビゲーム"], ["night", "夜"], ["online", "オンラインで"], ["friend", "友達"]],
    quiz:[{q:"\"She ___ music.\"（彼女は音楽が好きです）の空欄は？",opts:["like", "likes", "liking", "is like"],ans:1,exp:"主語が She（3人称単数）なので動詞に s をつけて likes にします。"},{q:"\"彼はテニスをしますか？\"の正しい英語は？",opts:["Do he play tennis?", "Does he play tennis?", "Does he plays tennis?", "Is he play tennis?"],ans:1,exp:"3人称単数の疑問文は Does + 主語 + 動詞の原形? です。sは消えます。"},{q:"\"He doesn't ___ coffee.\"（彼はコーヒーを飲みません）の空欄は？",opts:["drinks", "drink", "drinking", "to drink"],ans:1,exp:"doesn'tの後ろは動詞の原形（sなし）を使います。"}]
  },
  {
    id:6,title:"命令文",subtitle:"「〜しなさい」「〜してはいけません」",keyword:"命令文",
    scene:"📍 ミアがユウトにゲームを教える",
    char1:{icon:"👧",name:"Mia",en:"Look at the screen! Click the red button. Don't click the blue one!",jp:"画面を見て！赤いボタンをクリックして。青いのはクリックしないで！"},
    char2:{icon:"🧑‍🎓",name:"Yuto",en:"Oops! Too late. Please help me!",jp:"あっ！もう遅かった。助けて！"},
    grammarLabel:"命令文の作り方",
    grammarPattern:"動詞の原形〜. / Don't + 動詞の原形〜.",
    grammarText:"命令文は主語（You）を省略し、<strong>動詞の原形で文を始める</strong>。「〜してはいけません」は<strong>Don't</strong>を動詞の前に置く。<span class=\"ex\">Open the door. / Don't open the door.</span>丁寧にしたいときは Please を文頭か文末につける。",
    vocab:[["look at", "〜を見る"], ["screen", "画面"], ["click", "クリックする"], ["button", "ボタン"], ["help", "助ける"]],
    quiz:[{q:"\"ドアを閉めなさい。\"の正しい英語は？",opts:["You close the door.", "Close the door.", "Closing the door.", "You closes the door."],ans:1,exp:"命令文は主語を省略し動詞の原形で始めます。"},{q:"\"ここで走ってはいけません。\"の正しい英語は？",opts:["Not run here.", "Don't run here.", "Doesn't run here.", "No run here."],ans:1,exp:"否定の命令文は Don't + 動詞の原形 です。"},{q:"\"Please help me.\" の意味は？",opts:["私を助けないで", "私を助けてください", "私が助けます", "私は助けが必要ない"],ans:1,exp:"Pleaseをつけると丁寧な依頼の意味になります。"}]
  },
  {
    id:7,title:"can（〜できる）",subtitle:"能力・許可を表す助動詞",keyword:"can",
    scene:"📍 できることについて話す",
    char1:{icon:"🧑‍🎓",name:"Yuto",en:"I can swim very fast. Can you swim?",jp:"僕はとても速く泳げます。あなたは泳げますか？"},
    char2:{icon:"👧",name:"Mia",en:"No, I can't swim well. But I can speak three languages!",jp:"いいえ、私は上手に泳げません。でも私は3つの言語を話せます！"},
    grammarLabel:"canの使い方",
    grammarPattern:"主語 + can(can't) + 動詞の原形〜.",
    grammarText:"<strong>can</strong>は「〜できる」という能力や、「〜してもいい」という許可を表す助動詞。主語が誰でも形は変わらないのが特徴。<span class=\"ex\">She can sing. / Can you cook? / I can't drive.</span>否定形は can't（cannot）、疑問文はCanを文頭に置く。",
    vocab:[["swim", "泳ぐ"], ["fast", "速く"], ["well", "上手に"], ["speak", "話す"], ["language", "言語"]],
    quiz:[{q:"\"彼女はピアノを弾けます。\"の正しい英語は？",opts:["She can plays piano.", "She can play piano.", "She cans play piano.", "She is can play piano."],ans:1,exp:"canの後は主語に関わらず動詞の原形を使います。"},{q:"\"あなたは運転できますか？\"の正しい英語は？",opts:["Do you can drive?", "Can you drive?", "Are you can drive?", "You can drive?"],ans:1,exp:"canの疑問文はCanを文の最初に置きます。"},{q:"\"I can't cook.\" の意味は？",opts:["私は料理が好きではない", "私は料理ができない", "私は料理をしない", "私は料理を知らない"],ans:1,exp:"can'tは「〜できない」という能力の否定を表します。"}]
  },
  {
    id:8,title:"現在進行形 (be + ing)",subtitle:"「今、まさに〜している」を表す形",keyword:"現在進行形",
    scene:"📍 ビデオ通話・ミアは忙しい様子",
    char1:{icon:"🧑‍🎓",name:"Yuto",en:"What are you doing right now?",jp:"あなたは今何をしていますか？"},
    char2:{icon:"👧",name:"Mia",en:"I am cooking dinner! My mom is watching TV in the living room.",jp:"夕食を作っているところです！私の母はリビングでテレビを見ています。"},
    grammarLabel:"現在進行形の作り方",
    grammarPattern:"主語 + am/are/is + 動詞のing形〜.",
    grammarText:"「今この瞬間〜している」と言うときは<strong>be動詞 + 動詞のing形</strong>を使う。<span class=\"ex\">I am studying now. / He is running.</span>cook→cooking、run→runningのように、語尾によってing形の作り方が少し変わる点に注意。",
    vocab:[["right now", "ちょうど今"], ["cook", "料理する"], ["dinner", "夕食"], ["watch", "見る"], ["living room", "リビング"]],
    quiz:[{q:"\"彼は今、本を読んでいます。\"の正しい英語は？",opts:["He reads a book now.", "He is reading a book now.", "He read a book now.", "He reading a book now."],ans:1,exp:"現在進行形は be動詞 + 動詞のing形 です。He なので is を使います。"},{q:"\"run\"のing形は？",opts:["runing", "runeing", "running", "runs"],ans:2,exp:"短い母音+子音で終わる動詞は子音を重ねてingをつけます（run→running）。"},{q:"\"What are you doing?\" の意味は？",opts:["あなたは何が好きですか", "あなたは何をしましたか", "あなたは何をしていますか", "あなたは何をしますか"],ans:2,exp:"現在進行形の疑問文で「今何をしているか」を聞いています。"}]
  },
  {
    id:9,title:"過去形（be動詞 was/were）",subtitle:"「〜でした」昔の状態を表す",keyword:"was/were",
    scene:"📍 先週末について話す",
    char1:{icon:"👧",name:"Mia",en:"How was your weekend?",jp:"あなたの週末はどうでしたか？"},
    char2:{icon:"🧑‍🎓",name:"Yuto",en:"It was amazing! My friends and I were at the beach all day.",jp:"最高でした！僕と友達は一日中ビーチにいました。"},
    grammarLabel:"be動詞の過去形",
    grammarPattern:"I/He/She/It + was〜. / You/We/They + were〜.",
    grammarText:"be動詞の過去形は<strong>was（am/isの過去）</strong>と<strong>were（areの過去）</strong>の2つだけ。<span class=\"ex\">I was happy. / They were tired.</span>否定形は wasn't / weren't、疑問文は Was/Were を文頭に置く。",
    vocab:[["weekend", "週末"], ["amazing", "すごい"], ["beach", "ビーチ"], ["all day", "一日中"], ["tired", "疲れた"]],
    quiz:[{q:"\"私は昨日忙しかった。\"の正しい英語は？",opts:["I am busy yesterday.", "I was busy yesterday.", "I were busy yesterday.", "I is busy yesterday."],ans:1,exp:"主語がIで過去のことなのでwasを使います。"},{q:"\"They ___ at school.\"（彼らは学校にいました）の空欄は？",opts:["was", "were", "is", "are"],ans:1,exp:"主語がThey（複数）の過去形はwereです。"},{q:"\"How was your weekend?\" の意味は？",opts:["週末はどこにいましたか", "週末はどうでしたか", "週末は誰といましたか", "週末は何をしますか"],ans:1,exp:"How was 〜? で「〜はどうでしたか」と感想を聞く表現です。"}]
  },
  {
    id:10,title:"過去形（規則動詞）",subtitle:"動詞にedをつけるだけ！",keyword:"規則動詞の過去形",
    scene:"📍 昨日について話す",
    char1:{icon:"🧑‍🎓",name:"Yuto",en:"I studied English for two hours yesterday. Then I played games.",jp:"僕は昨日2時間英語を勉強しました。それからゲームをしました。"},
    char2:{icon:"👧",name:"Mia",en:"Nice! I cleaned my room and cooked pasta for dinner.",jp:"いいね！私は部屋を掃除して、夕食にパスタを作りました。"},
    grammarLabel:"規則動詞の過去形",
    grammarPattern:"動詞 + ed（study→studied / play→played）",
    grammarText:"多くの動詞は最後に<strong>ed</strong>をつけるだけで過去形になる。<span class=\"ex\">clean→cleaned / cook→cooked / play→played</span>yで終わる語は注意：study→studied（yをiに変えてed）。eで終わる語はdだけ追加：like→liked。",
    vocab:[["study", "勉強する"], ["yesterday", "昨日"], ["then", "それから"], ["clean", "掃除する"], ["pasta", "パスタ"]],
    quiz:[{q:"\"clean\"の過去形は？",opts:["cleaned", "cleaning", "cleans", "cleand"],ans:0,exp:"cleanはそのままedをつけてcleanedになります。"},{q:"\"study\"の過去形は？",opts:["studyed", "studied", "studing", "studys"],ans:1,exp:"yで終わる動詞はyをiに変えてedをつけます（study→studied）。"},{q:"\"I played games yesterday.\" の意味は？",opts:["私は明日ゲームをします", "私は今ゲームをしています", "私は昨日ゲームをしました", "私はゲームが好きです"],ans:2,exp:"playedは過去形で「〜しました」という意味です。"}]
  },
  {
    id:11,title:"過去形（不規則動詞）",subtitle:"ed をつけない、特別な変化形",keyword:"不規則動詞の過去形",
    scene:"📍 ミアが旅行の話をする",
    char1:{icon:"👧",name:"Mia",en:"I went to Tokyo last year! I saw Mt. Fuji and ate ramen.",jp:"私は去年東京に行きました！富士山を見て、ラーメンを食べました。"},
    char2:{icon:"🧑‍🎓",name:"Yuto",en:"That's awesome! Did you have a good time?",jp:"それすごいね！楽しい時間を過ごせた？"},
    grammarLabel:"不規則動詞の過去形",
    grammarPattern:"go→went / see→saw / eat→ate / have→had",
    grammarText:"go, see, eat, have などの動詞は<strong>edをつけず、特別な形</strong>に変化する。これは暗記するしかない。<span class=\"ex\">go→went / see→saw / eat→ate / have→had / make→made / come→came</span>疑問文・否定文ではdid/didn'tを使い、動詞は原形に戻る点に注意。",
    vocab:[["went (go)", "行った"], ["saw (see)", "見た"], ["ate (eat)", "食べた"], ["last year", "去年"], ["trip", "旅行"]],
    quiz:[{q:"\"go\"の過去形は？",opts:["goed", "wented", "went", "gone"],ans:2,exp:"goの過去形は不規則変化でwentです。"},{q:"\"あなたは良い時間を過ごしましたか？\"の正しい英語は？",opts:["Did you had a good time?", "Did you have a good time?", "Do you had a good time?", "Were you have a good time?"],ans:1,exp:"didの後の動詞は原形に戻ります。haveのままでOKです。"},{q:"\"eat\"の過去形は？",opts:["eated", "ate", "eaten", "eating"],ans:1,exp:"eatの過去形は不規則変化でateです。"}]
  },
  {
    id:12,title:"There is/are 〜",subtitle:"「〜があります」存在を伝える表現",keyword:"There is/are",
    scene:"📍 ミアが自分の町を紹介する",
    char1:{icon:"👧",name:"Mia",en:"There is a big park near my house. There are many trees in it.",jp:"私の家の近くに大きな公園があります。その中にたくさんの木があります。"},
    char2:{icon:"🧑‍🎓",name:"Yuto",en:"Sounds nice! Is there a lake too?",jp:"いいね！湖もありますか？"},
    grammarLabel:"There is/areの使い方",
    grammarPattern:"There is + 単数. / There are + 複数.",
    grammarText:"「〜があります・います」というとき、その物が<strong>単数ならThere is</strong>、<strong>複数ならThere are</strong>を使う。<span class=\"ex\">There is a cat. / There are three cats.</span>疑問文はIs/Areを最初に出し、否定文はisn't/aren'tを使う。",
    vocab:[["park", "公園"], ["near", "〜の近く"], ["tree", "木"], ["lake", "湖"], ["many", "たくさんの"]],
    quiz:[{q:"\"私の部屋に猫が1匹います。\"の正しい英語は？",opts:["There are a cat in my room.", "There is a cat in my room.", "There has a cat in my room.", "My room is a cat."],ans:1,exp:"catは単数なのでThere isを使います。"},{q:"\"There ___ many books on the desk.\"（机の上にたくさんの本があります）の空欄は？",opts:["is", "are", "has", "have"],ans:1,exp:"booksが複数形なのでThere areを使います。"},{q:"\"Is there a lake?\" に「いいえ、ありません」と答えるには？",opts:["No, it isn't.", "No, there isn't.", "No, it doesn't.", "No, there don't."],ans:1,exp:"There is/areの疑問文にはNo, there isn't(aren't).で答えます。"}]
  },
  {
    id:13,title:"疑問詞 (what/who/when/where/why/how)",subtitle:"知りたい情報を聞き出す6つの言葉",keyword:"疑問詞",
    scene:"📍 お互いのことを知る",
    char1:{icon:"🧑‍🎓",name:"Yuto",en:"What is your favorite food? And when is your birthday?",jp:"あなたの好きな食べ物は何ですか？そしてあなたの誕生日はいつですか？"},
    char2:{icon:"👧",name:"Mia",en:"I love pizza! My birthday is in March. Why do you ask?",jp:"ピザが大好きです！私の誕生日は3月です。なぜ聞くの？"},
    grammarLabel:"6つの疑問詞",
    grammarPattern:"What(何) / Who(誰) / When(いつ) / Where(どこ) / Why(なぜ) / How(どうやって)",
    grammarText:"疑問詞は具体的な情報を聞くときに使う。<span class=\"ex\">What is this? / Who is she? / When do you study? / Where do you live? / Why are you tired? / How do you go to school?</span>疑問詞は必ず<strong>文の最初</strong>に置くのがルール。",
    vocab:[["favorite", "大好きな"], ["birthday", "誕生日"], ["March", "3月"], ["ask", "聞く"], ["live", "住む"]],
    quiz:[{q:"「あなたはどこに住んでいますか？」の正しい英語は？",opts:["Where do you live?", "What do you live?", "Who do you live?", "When do you live?"],ans:0,exp:"場所を聞くときはWhereを使います。"},{q:"「あなたはなぜ忙しいのですか？」の正しい英語は？",opts:["How are you busy?", "Why are you busy?", "What are you busy?", "When are you busy?"],ans:1,exp:"理由を聞くときはWhyを使います。"},{q:"\"How do you go to school?\" の意味は？",opts:["あなたはいつ学校に行きますか", "あなたはどうやって学校に行きますか", "あなたはなぜ学校に行きますか", "あなたは誰と学校に行きますか"],ans:1,exp:"Howは方法・手段を聞く疑問詞です。"}]
  },
  {
    id:14,title:"前置詞 (in/on/at)",subtitle:"場所と時を表す小さくて重要な言葉",keyword:"前置詞",
    scene:"📍 オンラインで会う約束をする",

<script>
// ============================================================
// TEXT TO SPEECH
// ============================================================
let currentUtterance = null;
let currentAudioEl = null;

function stopAllSpeech() {
  if (currentAudioEl) {
    try { currentAudioEl.pause(); currentAudioEl.currentTime = 0; } catch(e) {}
    currentAudioEl = null;
  }
  if (currentUtterance) {
    window.speechSynthesis.cancel();
    currentUtterance = null;
  }
  document.querySelectorAll('.speak-btn').forEach(b => {
    b.textContent = '🔊';
    b.classList.remove('speaking');
  });
}

function speak(text, btn) {
  const wasThisPlaying = btn.classList && btn.classList.contains && btn.classList.contains('speaking');
  stopAllSpeech();
  if (wasThisPlaying) return; // 再生中に同じボタンを押したら「止める」だけ

  const audioId = btn.dataset ? btn.dataset.audioId : null;
  if (audioId) {
    playPreGeneratedAudio(audioId, text, btn);
  } else {
    speakBrowserTTS(text, btn);
  }
}

function playPreGeneratedAudio(audioId, text, btn) {
  const audio = new Audio(`${audioId}.mp3`);
  currentAudioEl = audio;
  btn.textContent = '⏹';
  btn.classList.add('speaking');

  audio.addEventListener('ended', () => {
    btn.textContent = '🔊';
    btn.classList.remove('speaking');
    currentAudioEl = null;
  });
  audio.addEventListener('error', () => {
    // 音声ファイルがまだ無い・見つからない場合はブラウザ音声にフォールバック
    currentAudioEl = null;
    speakBrowserTTS(text, btn);
  });
  audio.play().catch(() => {
    currentAudioEl = null;
    speakBrowserTTS(text, btn);
  });
}

function speakBrowserTTS(text, btn) {
  const gender = (btn.dataset && btn.dataset.gender) || 'female';

  let voices = window.speechSynthesis.getVoices();
  // 声リストがまだ読み込まれていない場合は少し待って再試行
  if (voices.length === 0) {
    window.speechSynthesis.onvoiceschanged = () => speakBrowserTTS(text, btn);
    window.speechSynthesis.getVoices();
    return;
  }

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'en-US';

  const enVoices = voices.filter(v => v.lang === 'en-US' || v.lang === 'en_US');
  const allEnVoices = voices.filter(v => v.lang.startsWith('en'));

  // iOS/macOS の既知の男性・女性英語ボイス名（優先順）
  const maleNames   = ['Aaron','Gordon','Fred','Ralph','Bruce','Reed','Rishi','Rocko','Thomas','Martin','Daniel'];
  const femaleNames = ['Samantha','Victoria','Karen','Moira','Fiona','Tessa','Zira','Susan','Jenny'];

  let voice = null;
  if (gender === 'male') {
    for (const name of maleNames) {
      voice = (enVoices.concat(allEnVoices)).find(v => v.name.includes(name));
      if (voice) break;
    }
    if (!voice) voice = allEnVoices.find(v => v.name.toLowerCase().includes('male'));
    if (!voice) voice = enVoices[0] || allEnVoices[0];
    utterance.pitch = 1.0;
    utterance.rate  = 0.85;
  } else {
    for (const name of femaleNames) {
      voice = (enVoices.concat(allEnVoices)).find(v => v.name.includes(name));
      if (voice) break;
    }
    if (!voice) voice = allEnVoices.find(v => v.name.toLowerCase().includes('female'));
    if (!voice) voice = enVoices[1] || enVoices[0] || allEnVoices[0];
    utterance.pitch = 1.05;
    utterance.rate  = 0.85;
  }

  if (voice) utterance.voice = voice;
  utterance.text = text;

  utterance.onstart = () => {
    btn.textContent = '⏹';
    btn.classList.add('speaking');
  };
  utterance.onend = () => {
    btn.textContent = '🔊';
    btn.classList.remove('speaking');
    currentUtterance = null;
  };
  utterance.onerror = () => {
    btn.textContent = '🔊';
    btn.classList.remove('speaking');
    currentUtterance = null;
  };

  currentUtterance = utterance;
  window.speechSynthesis.speak(utterance);
}

function highlightGrammar(text, keyword) {
  var patterns = GRAMMAR_HIGHLIGHTS[keyword];
  if (!patterns || patterns.length === 0) return text;
  var result = text;
  var sorted = patterns.slice().sort(function(a,b){ return b.length - a.length; });
  sorted.forEach(function(pattern) {
    try {
      var escaped = pattern.replace(/[.*+?^${}()|\[\]\\]/g, '\\$&');
      var regex = new RegExp('\\b(' + escaped + ')\\b', 'g');
      result = result.replace(regex, '<span class="grammar-hl">$1</span>');
    } catch(e) {}
  });
  return result;
}

function wrapParens(text) {
  // （）や()の中身を改行禁止にして、入らなければ括弧ごと次の行に送る
  return text.replace(/([（(][^）)]*[）)])/g, '<span style="white-space:nowrap">$1</span>');
}

function formatPattern(text) {
  // 「/」区切りを改行に変換（スペースに挟まれた/のみ。g/cm³のような単位表記は対象外）
  return wrapParens(text.split(/\s+\/\s+/).join('<br>'));
}

function renderQuestion() {
  const q = currentQuiz[currentQuizIdx];
  document.getElementById('quiz-prog-bar').innerHTML =
    currentQuiz.map((_,i)=>`<div class="quiz-pd ${i<currentQuizIdx?'done':i===currentQuizIdx?'current':''}"></div>`).join('');
  document.getElementById('quiz-question').textContent = q.q;
  document.getElementById('quiz-options').innerHTML =
    q.opts.map((o,i)=>`<button class="quiz-option" onclick="answer(${i})">${o}</button>`).join('');
  document.getElementById('quiz-feedback').className = 'quiz-feedback';
  document.getElementById('quiz-next-btn').className = 'quiz-next-btn';
}

function answer(chosen) {
  const q = currentQuiz[currentQuizIdx];
  document.querySelectorAll('.quiz-option').forEach(o=>o.disabled=true);
  const fb = document.getElementById('quiz-feedback');
  if (chosen===q.ans) {
    document.querySelectorAll('.quiz-option')[chosen].classList.add('correct');
    fb.className='quiz-feedback correct-fb show';
    fb.innerHTML=`⭕ Correct!<br>${q.exp}`;
    quizScore++;
  } else {
    document.querySelectorAll('.quiz-option')[chosen].classList.add('wrong');
    document.querySelectorAll('.quiz-option')[q.ans].classList.add('correct');
    fb.className='quiz-feedback wrong-fb show';
    fb.innerHTML=`❌ 不正解。正解は「${q.opts[q.ans]}」<br>${q.exp}`;
  }
  document.getElementById('quiz-next-btn').className='quiz-next-btn show';
}

function nextQuestion() {
  currentQuizIdx++;
  if(currentQuizIdx>=currentQuiz.length) showResult();
  else renderQuestion();
}

function showResult() {
  ['quiz-question','quiz-options','quiz-feedback','quiz-next-btn','quiz-prog-bar','quiz-ep-label']
    .forEach(id=>{ document.getElementById(id).style.display='none'; });
  const grade = GRADES.find(g=>g.id===lastQuizGradeId);
  const ep = grade.episodes[lastQuizEpIdx];
  if(!quizMap[lastQuizGradeId]) quizMap[lastQuizGradeId]={};
  quizMap[lastQuizGradeId][lastQuizEpIdx]=quizScore;
  localStorage.setItem('engQuizMap',JSON.stringify(quizMap));
  const stamps=['😢','😅','😊','🎉'];
  const labels=['もう一度読んでみよう！','もう少し！','よくできました！','満点！パーフェクト！'];
  const si=quizScore===3?3:quizScore>=2?2:quizScore===1?1:0;
  document.getElementById('result-stamp').textContent=stamps[si];
  document.getElementById('result-score').textContent=`${quizScore}/3`;
  document.getElementById('result-label').textContent=labels[si];
  document.getElementById('result-sub').textContent=`${grade.name} 第${ep.id}話「${ep.keyword}」のクイズ結果`;
  document.getElementById('quiz-result').className='quiz-result show';
}

function retryQuiz() { startQuiz(lastQuizGradeId,lastQuizEpIdx); }

  if(name==='hub') renderHub();
}

function findExampleSentence(word, ep) {
  // 事前計算済みマップから、その単語が実際に使われている「1文だけ」の例文を取得
  // (レッスンの複数文まるごと再利用すると、続きがあるようなトーンに聞こえるため
  //  該当する1文だけを抜き出して別音声で用意している)
  const key = word.toLowerCase();
  const found = EXAMPLE_AUDIO_MAP[key];
  if (!found) return null;
  return {
    en: found.en,
    jp: found.jp,
    gender: found.gender,
    audioId: found.audioId
  };
}

function getAllVocabForGrade() {
  // 現在の学年の全レッスンから単語を集める（重複は最初の出現を優先）
  const seen = new Set();
  const all = [];
  currentGrade.episodes.forEach(ep => {
    (ep.vocab || []).forEach(([en, jp]) => {
      const key = en.toLowerCase();
      if (!seen.has(key)) {
        seen.add(key);
        const tip = (typeof VOCAB_TIPS !== 'undefined' && VOCAB_TIPS[key]) ? VOCAB_TIPS[key] : null;
        const example = findExampleSentence(en, ep);
        all.push({ en, jp, tip, example });
      }
    });
  });
  return all;
}

function startVocabTraining() {
  const allWords = getAllVocabForGrade();
  if (allWords.length === 0) {
    alert('この学年の単語データがまだありません。');
    return;
  }

  // 定着度が低い単語ほど出やすいように重み付き抽出
  const weighted = [];
  allWords.forEach(w => {
    const level = vocabStats[w.en.toLowerCase()] ?? 0;
    const weight = Math.max(1, 5 - level); // レベル0→重み5、レベル4→重み1
    for (let i = 0; i < weight; i++) weighted.push(w);
  });

  // ランダムに最大12語を重複なしで選ぶ
  const picked = [];
  const pickedKeys = new Set();
  const shuffled = weighted.slice().sort(() => Math.random() - 0.5);
  for (const w of shuffled) {
    if (!pickedKeys.has(w.en) && picked.length < 12) {
      pickedKeys.add(w.en);
      picked.push(w);
    }
  }

  vocabSession = picked;
  vocabSessionIdx = 0;
  vocabSessionResults = { forgot:0, vague:0, gotIt:0 };
  document.getElementById('vocab-result').style.display = 'none';
  document.getElementById('vocab-card-wrap').style.display = 'flex';
  showScreen('vocab');
  renderVocabCard();
}

function renderVocabCard() {
  if (vocabSessionIdx >= vocabSession.length) {
    showVocabResult();
    return;
  }
  const w = vocabSession[vocabSessionIdx];
  vocabFlipped = false;

  document.getElementById('vocab-prog-bar').innerHTML =
    vocabSession.map((_, i) => `<div class="vocab-pd ${i < vocabSessionIdx ? 'done' : i === vocabSessionIdx ? 'current' : ''}"></div>`).join('');

  const level = vocabStats[w.en.toLowerCase()] ?? 0;
  const levelLabels = ['未学習','うろ覚え','まあまあ','覚えた','完璧'];
  document.getElementById('vocab-level-badge').className = `vocab-level-badge lv${level}`;
  document.getElementById('vocab-level-badge').textContent = levelLabels[level];
  document.getElementById('vocab-en').textContent = w.en;
  document.getElementById('vocab-en-small').textContent = w.en;
  document.getElementById('vocab-jp').textContent = w.jp;
  document.getElementById('vocab-tip-text').textContent = w.tip || 'この単語は、何度も繰り返し使って覚えていこう！';

  // 例文ボタンの表示制御（例文が見つかったレッスンのみボタンを出す）
  const exampleBtn = document.getElementById('vocab-example-btn');
  const exampleBox = document.getElementById('vocab-example-box');
  if (w.example) {
    exampleBtn.style.display = 'block';
  } else {
    exampleBtn.style.display = 'none';
  }
  exampleBox.style.display = 'none';
  exampleBtn.textContent = '📝 例文で確認する';

  document.getElementById('vocab-card-front').style.display = 'flex';
  document.getElementById('vocab-card-back').style.display = 'none';
  document.getElementById('vocab-rate-buttons').style.display = 'none';
}

function flipVocabCard() {
  if (vocabFlipped) return;
  vocabFlipped = true;
  document.getElementById('vocab-card-front').style.display = 'none';
  document.getElementById('vocab-card-back').style.display = 'flex';
  document.getElementById('vocab-rate-buttons').style.display = 'flex';
}

function speakVocabWord() {
  const w = vocabSession[vocabSessionIdx];
  if (!w) return;
  const audioId = VOCAB_AUDIO_MAP[w.en.toLowerCase()];
  const fakeBtn = {
    dataset: { gender: 'female', audioId: audioId },
    textContent: '', classList: { add(){}, remove(){}, contains(){ return false; } }
  };
  speak(w.en, fakeBtn);
}

function toggleVocabExample() {
  const w = vocabSession[vocabSessionIdx];
  const box = document.getElementById('vocab-example-box');
  const btn = document.getElementById('vocab-example-btn');
  const isShowing = box.style.display === 'block';

  if (isShowing) {
    box.style.display = 'none';
    btn.textContent = '📝 例文で確認する';
  } else {
    if (w.example) {
      document.getElementById('vocab-example-en').textContent = w.example.en;
      document.getElementById('vocab-example-jp').textContent = w.example.jp;
    }
    box.style.display = 'block';
    btn.textContent = '📝 例文を閉じる';
  }
}

function speakVocabExample() {
  const w = vocabSession[vocabSessionIdx];
  if (!w || !w.example) return;
  const fakeBtn = {
    dataset: { gender: w.example.gender || 'female', audioId: w.example.audioId },
    textContent: '', classList: { add(){}, remove(){}, contains(){ return false; } }
  };
  speak(w.example.en, fakeBtn);
}

function rateVocabWord(rating) {
  const w = vocabSession[vocabSessionIdx];
  const key = w.en.toLowerCase();
  let level = vocabStats[key] ?? 0;

  if (rating === 0) { level = Math.max(0, level - 1); vocabSessionResults.forgot++; }
  else if (rating === 1) { vocabSessionResults.vague++; } // レベル変化なし（現状維持）
  else { level = Math.min(4, level + 1); vocabSessionResults.gotIt++; }

  vocabStats[key] = level;
  localStorage.setItem('vocabMastery', JSON.stringify(vocabStats));

  vocabSessionIdx++;
  renderVocabCard();
}

function showVocabResult() {
  document.getElementById('vocab-card-wrap').style.display = 'none';
  document.getElementById('vocab-rate-buttons').style.display = 'none';
  document.getElementById('vocab-prog-bar').innerHTML = '';
  const r = vocabSessionResults;
  document.getElementById('vocab-result-stats').innerHTML =
    `😵 まだ覚えてない：${r.forgot}語<br>🤔 うろ覚え：${r.vague}語<br>😊 覚えた！：${r.gotIt}語`;
  document.getElementById('vocab-result').style.display = 'flex';
}
</script>

<script id="mikata-theme-js">
(function(){
  var C={"T": "MIA_AVATAR_B64", "S": "YUTO_AVATAR_B64", "read": "engReadMap", "gvar": "currentGradeId", "list": "GRADES", "sel": "selectGrade"};
  function g(n){try{return eval(n)}catch(e){return undefined}}
  function setPair(){
    var t=document.getElementById('thT'),s=document.getElementById('thS');
    var T=g(C.T),S=g(C.S);if(t&&T)t.src=T;if(s&&S)s.src=S;
  }
  var KEY='mikata_last_'+C.read;
  function save(i){try{localStorage.setItem(KEY,JSON.stringify({g:g(C.gvar),i:i,t:Date.now()}))}catch(e){}}
  function renderContinue(){
    var el=document.getElementById('th-continue');if(!el)return;
    var last=null;try{last=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
    var list=g(C.list)||[];
    var grade=last&&list.find(function(x){return x.id===last.g});
    var ep=grade&&grade.episodes&&grade.episodes[last.i];
    if(!grade||!ep||grade.locked){el.hidden=true;return}
    el.innerHTML='<div><small>つづきから</small><b>'+grade.name+'・'+(ep.title||ep.keyword||'')+'</b></div><span class="go">読む ▶</span>';
    el.hidden=false;
    el.onclick=function(){var sel=g(C.sel);if(sel){sel(last.g)}var r=g('readEp');if(r)r(last.i)};
  }
  var orig=g('readEp');
  if(typeof orig==='function'){window.readEp=function(i){var r=orig.apply(this,arguments);save(i);return r}}
  var oshow=g('showScreen');
  if(typeof oshow==='function'){window.showScreen=function(n){var r=oshow.apply(this,arguments);if(n==='home')renderContinue();return r}}
  function init(){setPair();renderContinue()}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
  window.addEventListener('load',init);
})();
</script>
</body>
</html>
